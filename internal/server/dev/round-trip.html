<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>dropln — crypto round-trip</title>
<style>
  :root { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
  h1 { margin-bottom: 0.25rem; }
  p.lead { color: #666; margin-top: 0; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  legend { font-weight: 600; padding: 0 0.5rem; }
  label { display: block; margin: 0.5rem 0; }
  label > span { display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.15rem; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.9rem; padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px;
  }
  textarea { min-height: 5rem; resize: vertical; }
  .row { display: flex; gap: 1rem; }
  .row > * { flex: 1; }
  button {
    padding: 0.55rem 1rem; cursor: pointer; border: 0; border-radius: 4px;
    background: #2855e0; color: #fff; font-weight: 600;
  }
  button:hover { background: #1f47bd; }
  pre {
    background: #f6f6f6; border: 1px solid #e3e3e3; padding: 0.75rem; border-radius: 4px;
    overflow: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all;
  }
  .ok { color: #0a7d2c; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>dropln crypto round-trip</h1>
  <p class="lead">Vanilla JS · Web Crypto API · Format v2 — Go server ile uyum testi.</p>

  <fieldset>
    <legend>1. Encrypt &amp; POST</legend>
    <label><span>Plaintext</span><textarea id="plaintext">Merhaba dropln! 🇹🇷</textarea></label>
    <div class="row">
      <label><span>Password (opsiyonel)</span><input type="password" id="password"></label>
      <label><span>Expire</span>
        <select id="expire">
          <option>5min</option><option>10min</option><option>1hour</option>
          <option>1day</option><option>1week</option>
        </select>
      </label>
    </div>
    <label><input type="checkbox" id="bar"> Burn after read</label>
    <button id="create">Create paste</button>
    <pre id="createOut"></pre>
  </fieldset>

  <fieldset>
    <legend>2. Read &amp; Decrypt</legend>
    <p style="color:#666;font-size:0.85rem;margin:0 0 0.5rem;">"Create" otomatik dolduruyor; manuel de girebilirsin.</p>
    <label><span>Paste ID</span><input type="text" id="readId"></label>
    <label><span>Key (base64)</span><input type="text" id="readKey"></label>
    <label><span>Password (varsa)</span><input type="password" id="readPassword"></label>
    <button id="read">Read &amp; Decrypt</button>
    <pre id="readOut"></pre>
  </fieldset>

  <script>
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    function b64(bytes) {
      let s = '';
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s);
    }
    function b64dec(str) {
      const bin = atob(str);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function concat(...arrs) {
      const total = arrs.reduce((n, a) => n + a.length, 0);
      const out = new Uint8Array(total);
      let off = 0;
      for (const a of arrs) { out.set(a, off); off += a.length; }
      return out;
    }

    // Replicates PrivateBin's PBKDF2 step:
    //   material = rawKey || password    (concatenated bytes)
    //   AES-256-GCM key = PBKDF2-SHA256(material, salt, iterations, 32 bytes)
    async function deriveKey(rawKey, password, salt, iterations) {
      const material = concat(rawKey, enc.encode(password || ''));
      const baseKey = await crypto.subtle.importKey(
        'raw', material, 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptPaste({ plaintext, password, expire, burnAfterRead }) {
      const rawKey = crypto.getRandomValues(new Uint8Array(32));
      const iv     = crypto.getRandomValues(new Uint8Array(16));
      const salt   = crypto.getRandomValues(new Uint8Array(8));
      const iterations = 100000;

      // adata is PrivateBin's authenticated metadata. Order matters; this is
      // the JSON form we'll feed as AAD into AES-GCM.
      const adata = [
        [b64(iv), b64(salt), iterations, 256, 128, 'aes', 'gcm', 'none'],
        'plaintext',
        0,
        burnAfterRead ? 1 : 0
      ];

      const key = await deriveKey(rawKey, password, salt, iterations);
      const aad = enc.encode(JSON.stringify(adata));
      const message = enc.encode(JSON.stringify({ paste: plaintext }));

      const ctBuf = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv, additionalData: aad, tagLength: 128 },
        key, message
      );

      return {
        envelope: {
          v: 2,
          ct: b64(new Uint8Array(ctBuf)),
          adata,
          meta: { expire }
        },
        keyB64: b64(rawKey)
      };
    }

    async function decryptPaste({ envelope, keyB64, password }) {
      const adata = envelope.adata;
      const cipher = adata[0];
      const iv   = b64dec(cipher[0]);
      const salt = b64dec(cipher[1]);
      const iterations = cipher[2];

      const rawKey = b64dec(keyB64);
      const key = await deriveKey(rawKey, password, salt, iterations);
      const aad = enc.encode(JSON.stringify(adata));
      const ctBytes = b64dec(envelope.ct);

      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv, additionalData: aad, tagLength: 128 },
        key, ctBytes
      );
      const obj = JSON.parse(dec.decode(plain));
      return obj.paste;
    }

    function setOut(el, klass, text) {
      el.className = klass;
      el.textContent = text;
    }

    document.getElementById('create').addEventListener('click', async () => {
      const out = document.getElementById('createOut');
      setOut(out, '', 'working...');
      try {
        const { envelope, keyB64 } = await encryptPaste({
          plaintext: document.getElementById('plaintext').value,
          password:  document.getElementById('password').value,
          expire:    document.getElementById('expire').value,
          burnAfterRead: document.getElementById('bar').checked,
        });

        const resp = await fetch('/api/v1/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(envelope)
        });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(`${resp.status} ${resp.statusText}: ${txt}`);
        }
        const { id, delete_token } = await resp.json();

        document.getElementById('readId').value = id;
        document.getElementById('readKey').value = keyB64;
        document.getElementById('readPassword').value = document.getElementById('password').value;

        setOut(out, 'ok',
          `id           : ${id}\n` +
          `delete_token : ${delete_token}\n` +
          `key (b64)    : ${keyB64}\n\n` +
          `envelope sent:\n${JSON.stringify(envelope, null, 2)}`);
      } catch (e) {
        const msg = e.message || `${e.name || 'Error'} — decrypt başarısız (yanlış password ya da bozuk envelope?)`;
        setOut(out, 'err', `ERROR: ${msg}`);
        console.error(e);
      }
    });

    document.getElementById('read').addEventListener('click', async () => {
      const out = document.getElementById('readOut');
      setOut(out, '', 'working...');
      try {
        const id = document.getElementById('readId').value.trim();
        const keyB64 = document.getElementById('readKey').value.trim();
        const password = document.getElementById('readPassword').value;
        if (!id || !keyB64) throw new Error('id ve key zorunlu');

        const resp = await fetch(`/api/v1/paste/${encodeURIComponent(id)}`);
        if (!resp.ok) throw new Error(`GET ${resp.status} ${resp.statusText}`);
        const envelope = await resp.json();

        const plaintext = await decryptPaste({ envelope, keyB64, password });
        setOut(out, 'ok', `decrypted plaintext:\n\n${plaintext}`);
      } catch (e) {
        const msg = e.message || `${e.name || 'Error'} — decrypt başarısız (yanlış password ya da bozuk envelope?)`;
        setOut(out, 'err', `ERROR: ${msg}`);
        console.error(e);
      }
    });
  </script>
</body>
</html>
