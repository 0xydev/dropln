# Production stack: Postgres + dropln + Caddy (auto-TLS).
#
# Caddy fronts the app on :80/:443, terminates TLS via Let's Encrypt, and
# reverse-proxies to dropln:8080 over the internal network. Dropln is not
# exposed on the host — only Caddy listens on the public interface.
#
# Usage:
#   1. cp .env.example .env  &&  edit POSTGRES_PASSWORD and SITE_DOMAIN
#   2. docker compose up -d --build
#   3. docker compose logs -f
#
# To run without Caddy (e.g. behind your own nginx/proxy), comment out the
# caddy service and uncomment the dropln `ports:` block to expose 8080.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dropln}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropln} -d ${POSTGRES_DB:-dropln}"]
      interval: 10s
      timeout: 5s
      retries: 6

  dropln:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DROPLN_DATABASE_URL: postgres://${POSTGRES_USER:-dropln}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dropln}?sslmode=disable
      DROPLN_ADDR: ${DROPLN_ADDR:-:8080}
      DROPLN_MAX_PASTE_BYTES: ${DROPLN_MAX_PASTE_BYTES:-33554432}
      DROPLN_RATE_LIMIT_PER_MIN: ${DROPLN_RATE_LIMIT_PER_MIN:-10}
      DROPLN_RATE_LIMIT_BURST: ${DROPLN_RATE_LIMIT_BURST:-5}
      DROPLN_TRUST_PROXY: ${DROPLN_TRUST_PROXY:-true}
      DROPLN_HSTS: ${DROPLN_HSTS:-true}
      DROPLN_DEV_ENDPOINTS: ${DROPLN_DEV_ENDPOINTS:-false}
    expose:
      - "8080"
    # Uncomment to expose dropln directly on the host (e.g. when running
    # without Caddy behind another reverse proxy).
    # ports:
    #   - "127.0.0.1:${DROPLN_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - dropln
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-dropln.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
