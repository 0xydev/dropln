# Production-ish compose for internal deployment.
#
# Brings up the app + Postgres with a persistent volume and a healthcheck.
# TLS termination is intentionally NOT included — put nginx / Caddy / your
# team's existing reverse proxy in front and proxy to dropln:8080.
#
# Usage:
#   1. cp .env.example .env  &&  edit values
#   2. docker compose up -d --build
#   3. docker compose logs -f dropln

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dropln}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropln} -d ${POSTGRES_DB:-dropln}"]
      interval: 10s
      timeout: 5s
      retries: 6

  dropln:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DROPLN_DATABASE_URL: postgres://${POSTGRES_USER:-dropln}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dropln}?sslmode=disable
      DROPLN_ADDR: ${DROPLN_ADDR:-:8080}
      DROPLN_MAX_PASTE_BYTES: ${DROPLN_MAX_PASTE_BYTES:-33554432}
      DROPLN_RATE_LIMIT_PER_MIN: ${DROPLN_RATE_LIMIT_PER_MIN:-10}
      DROPLN_RATE_LIMIT_BURST: ${DROPLN_RATE_LIMIT_BURST:-5}
      DROPLN_TRUST_PROXY: ${DROPLN_TRUST_PROXY:-false}
      DROPLN_HSTS: ${DROPLN_HSTS:-false}
    ports:
      # Bind to localhost so the reverse proxy on the same host fronts it,
      # but the app isn't exposed to the public network directly.
      - "127.0.0.1:${DROPLN_PORT:-8080}:8080"

volumes:
  postgres-data:
